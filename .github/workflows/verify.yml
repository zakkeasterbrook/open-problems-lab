name: Verify research artifacts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run full finite research verification
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r research/mathematics/prefix-reversal-asymptotics/requirements.txt
      - name: Check artifacts and run quick verification
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full }}
        run: python tools/check_lab.py --reproduce quick
      - name: Check artifacts and run full verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python tools/check_lab.py --reproduce full
      - name: Install spectral graph dependencies
        run: python -m pip install -r research/mathematics/cazenave-randic-spectral/requirements.txt
      - name: Reproduce spectral graph finite verification
        run: |
          project="$GITHUB_WORKSPACE/research/mathematics/cazenave-randic-spectral"
          (cd "$project" && sha256sum -c ARTIFACTS.sha256)
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp -a "$project/." "$work/"
          python "$work/verify.py"
          cmp "$project/results.json" "$work/results.json"
